<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラオケ練習ツール</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">
    <h1>カラオケ練習ツール</h1>

    <!-- 出し入れするボタン（押すと開閉） -->
    <div class="top-tools">
        <button id="fileToggleButton">📁 ファイル選択</button>
        <button id="detailToggleButton">⚙ 詳細操作</button>
        <button id="viewToggleButton">🎵 音程へ</button>
    </div>

    <!-- ファイル選択（押すとにゅっと出る・仕舞える） -->
    <div id="fileSection" class="collapsible open">
    <div class="audio-section">
        <h2>左耳から出る音源を選択してください</h2>
        <div class="bar-color">音程バーの色：<span class="chip" style="background:#4a90d9"></span>青</div>
        <input type="file" id="leftFile" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.mov,.mp4">
    </div>

    <div class="audio-section">
        <h2>右耳から出る音源を選択してください</h2>
        <div class="bar-color">音程バーの色：<span class="chip" style="background:#ef8a2d"></span>オレンジ</div>
        <input type="file" id="rightFile" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.mov,.mp4">
    </div>

    </div>

    <!-- 詳細操作（押すとにゅっと出る・仕舞える） -->
    <div id="detailPanel" class="collapsible">
        <div class="wave-tools">
            <button id="leftMuteButton">🔊 左：音あり</button>
            <button id="rightMuteButton">🔊 右：音あり</button>
            <button id="leftWaveLockButton">🔓 左波形：操作OK</button>
            <button id="rightWaveLockButton">🔓 右波形：操作OK</button>
            <button id="linkButton">連動：ON</button>
        </div>
    </div>

    <!-- 時間表示 -->
    <div id="timeDisplay">左 0:00 / 0:00　右 0:00 / 0:00</div>

    <!-- 波形（タップ・ドラッグで位置を動かす） -->
    <div class="wave-section">
        <div id="graphArea" class="graph-area">
            <canvas id="leftWave" class="wave"></canvas>
            <canvas id="rightWave" class="wave"></canvas>
            <!-- 音程表示（波形の上に重ねて、フェードで切り替える） -->
            <canvas id="pitchCanvas"></canvas>
        </div>
        <div id="pitchStatus"></div>
        <div class="pitch-legend">音程バー：左=青　右=オレンジ　<span class="chip" style="background:#2e9e5b"></span>左右が同じ音で重なった所　<span class="chip" style="background:#c2185b"></span>一番大きい声　<span class="chip" style="background:#263238"></span>一番小さい声</div>
        <div class="pitch-legend">バー上の記号：↗ しゃくり（下から上がる）　〜 ビブラート（細かく揺れる）　↘ フォール（語尾が下がる）</div>
        <!-- 音量の統計と、タップした音の詳細（音程表示のあいだだけ表示） -->
        <div id="volumeInfo" class="volume-info"></div>
    </div>

    <div class="seek-row">
        <button id="loopSettingsButton">ループ再生設定🔁</button>
    </div>

    <!-- ループ設定（ボタンを押したときだけ表示） -->
    <div id="loopControls">
        <div class="pin-grid">
            <button id="leftPinStart">左 開始📍</button>
            <button id="leftPinEnd">左 終了📍</button>
            <button id="rightPinStart">右 開始📍</button>
            <button id="rightPinEnd">右 終了📍</button>
        </div>
        <div id="pinInfo"></div>
        <button id="loopPlayButton">▶ 再生開始！</button>
    </div>

    <div class="controls">
        <button id="playButton">▶ 再生</button>
        <button id="stopButton">■ 停止</button>

        <button id="backButton">↩ 戻る</button>
        <button id="forwardButton">↪ 進む</button>

        <button id="syncButton">同期🔄</button>
    </div>

    <button id="settingsButton">詳細数字設定⚙</button>

    <div id="settingsPanel">
        <label>
            スキップ時間
            <input type="number" id="skipTime" value="5" min="1" step="1">
            秒
        </label>

        <label>
            音量調整幅
            <input type="number" id="volumeStep" value="0.1" min="0.01" max="1" step="0.1">
        </label>

        <label>
            波形表示幅
            <input type="number" id="waveWindow" value="5" min="0.5" max="120" step="0.5">
            秒
        </label>

        <hr>

        <div class="volume-control">
            <label>左音源 音量</label>
            <input type="range" id="leftVolume" min="0" max="1" step="0.1" value="1">
            <button id="leftVolumeDown">−</button>
            <button id="leftVolumeUp">＋</button>
        </div>

        <div class="volume-control">
            <label>右音源 音量</label>
            <input type="range" id="rightVolume" min="0" max="1" step="0.1" value="1">
            <button id="rightVolumeDown">−</button>
            <button id="rightVolumeUp">＋</button>
        </div>

        <hr>

        <label>
            再生速度
            <select id="playbackRate">
                <option value="0.5">0.5倍</option>
                <option value="0.75">0.75倍</option>
                <option value="1" selected>1倍</option>
                <option value="1.25">1.25倍</option>
                <option value="1.5">1.5倍</option>
                <option value="2">2倍</option>
            </select>
        </label>
    </div>

    <!-- デバッグ用コンソール（不要になったら2行とも削除） -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <script src="script.js?v=9"></script>
</div>
</body>
</html>
